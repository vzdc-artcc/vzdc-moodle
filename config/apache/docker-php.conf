# Replaces the base image's docker-php.conf, which also set AllowOverride All
# on the document root (the router documentation asks for AllowOverride None).
#
# PHP handles a .php path only when the file exists. A routed path that ends in
# .php but has no file behind it (Moodle's "shim" routes) then falls through to
# FallbackResource and reaches r.php, instead of mod_php answering 404.
<FilesMatch \.php$>
    <If "-f %{REQUEST_FILENAME}">
        SetHandler application/x-httpd-php
    </If>
</FilesMatch>

DirectoryIndex disabled
DirectoryIndex index.php index.html
