# Moodle 5.3 virtual host. Replaces the base image's 000-default.conf.
#
# Since Moodle 5.1 only public/ is served, and every path that is not a real
# file goes to the router, public/r.php:
# https://docs.moodle.org/503/en/Configuring_the_Router
ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /r.php

        # Hide internal files (https://docs.moodle.org/503/en/Apache, "Hiding
        # internal paths", 404 variant). Matched against the file on disk
        # rather than the URL, so that file-serving URLs such as
        # /pluginfile.php/.../vendor/x.js (SCORM packages) are not caught.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} (/vendor/|/node_modules/|/\.(?!well-known/)|composer\.json$|\.lock$|/environment\.xml$|/install\.xml$|/readme|/README|/upgrade\.txt$|/UPGRADING(-CURRENT)?\.md$|phpunit\.xml(\.dist)?$|/tests/behat/|/fixtures/|/lib/classes/)
        RewriteRule ^ - [R=404,L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
