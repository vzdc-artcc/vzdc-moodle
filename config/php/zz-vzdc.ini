; vZDC overrides. Named zz- so it loads after the base image's ini files.

memory_limit = 512M

; Cloudflare's Free plan caps a proxied request body at 100 MB.
upload_max_filesize = 100M
post_max_size = 100M

max_input_vars = 5000
max_execution_time = 300
expose_php = Off

; The code never changes inside a running container, so OPcache never needs to
; look at file timestamps. Moodle invalidates the PHP files it writes itself
; (the cache configuration and the component cache) with opcache_invalidate().
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1

; The base image is also used for development and shows errors in the page.
display_errors = Off
display_startup_errors = Off
log_errors = On
